# Releases the packages changed since their last tag, as twake-libs does: multi-semantic-release sets
# each version from the commits, publishes to npm with a provenance statement, tags, and commits the
# changelog and the version. See the Publishing section of AGENTS.md.
# On npmjs.com, each package needs this repository, publish.yml and the npm environment as a trusted
# publisher.
name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: publish

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write # tags, GitHub releases and the release commit
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # @semantic-release/github comments on released pull requests
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads the tags and the commits since them

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # No lifecycle scripts while the OIDC token can be requested
      - run: npm ci --ignore-scripts

      - run: npm test

      - run: npm run lint

      - run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `n8n-node prerelease`, the prepublishOnly script, refuses to publish without it
          RELEASE_MODE: 'true'
        run: npm run release
